apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: inference-blue
spec:
  ingressClassName: nginx
  rules:
  - host: inference.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: inference-svc-blue
            port:
              number: 80
