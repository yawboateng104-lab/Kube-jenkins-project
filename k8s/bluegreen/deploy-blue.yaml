apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-blue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inference
      version: blue
  template:
    metadata:
      labels:
        app: inference
        version: blue
    spec:
      containers:
      - name: api
        image: inference-api:1.0
        ports:
        - containerPort: 8080

